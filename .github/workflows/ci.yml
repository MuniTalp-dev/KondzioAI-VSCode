name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run compile
      - run: npm run package
      - uses: actions/upload-artifact@v7
        with:
          name: kondzio-ai-vsix
          path: "*.vsix"
          if-no-files-found: error
