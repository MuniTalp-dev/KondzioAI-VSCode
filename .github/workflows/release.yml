name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run compile
      - run: npm run package
      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$packageVersion" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} nie odpowiada package.json v$packageVersion"
          }
      - name: Calculate SHA-256
        shell: pwsh
        run: Get-FileHash *.vsix -Algorithm SHA256 | Format-List | Out-File -Encoding utf8 SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            *.vsix
            SHA256SUMS.txt
          generate_release_notes: true
